name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test, validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify committed dist is up to date
        shell: bash
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is stale. Run 'npm run build' and commit the result." >&2
            git status --porcelain dist >&2
            exit 1
          fi
      - run: node --test "dist/tests/*.test.js"
      - name: Validate plugin manifest
        shell: bash
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed OpenRouter or other API keys
        shell: bash
        run: |
          set -euo pipefail
          # Tests assemble synthetic tokens from fragments at runtime, so nothing key-shaped
          # should exist anywhere in the tree, including test files.
          if git grep -nE 'sk-or-v1-[A-Za-z0-9_-]{20,}' ; then
            echo "Possible OpenRouter key committed." >&2; exit 1
          fi
          if git grep -nE '(ghp|gho|ghu|ghs)_[A-Za-z0-9]{36}' ; then
            echo "Possible GitHub token committed." >&2; exit 1
          fi
          echo "No key patterns found."
